{% extends 'base.html' %}

{% block title %}Services - PixelPilot{% endblock %}

{% block content %}
<section class="py-20 bg-gray-50">
    <div class="max-w-7xl mx-auto px-6">
        <h1 class="text-5xl font-bold text-center mb-4">Our Services</h1>
        <p class="text-center text-xl text-gray-600 mb-16">Specializing in Social Media Advertising & Visual Campaigns</p>

        <div class="grid md:grid-cols-2 gap-10">
            {% for service in services %}
            <div class="bg-white p-10 rounded-3xl shadow hover:shadow-2xl transition-all">
                <i class="{{ service.icon }} text-6xl text-blue-600 mb-6"></i>
                <h3 class="text-3xl font-semibold mb-4">{{ service.name }}</h3>
                <p class="text-gray-600 leading-relaxed">{{ service.description|safe }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
