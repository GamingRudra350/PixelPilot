{% extends 'base.html' %}

{% block title %}{{ post.title }} - PixelPilot{% endblock %}

{% block content %}
<section class="py-20">
    <div class="max-w-4xl mx-auto px-6">
        <!-- Blog Image -->
        {% if post.image %}
        <img src="{{ post.image.url }}" 
             class="w-full h-96 object-cover rounded-3xl mb-10" 
             alt="{{ post.title }}">
        {% endif %}

        <h1 class="text-4xl md:text-5xl font-bold leading-tight mb-6">
            {{ post.title }}
        </h1>

        <div class="flex items-center gap-4 text-gray-500 mb-10">
            <span>{{ post.created_at|date:"d F, Y" }}</span>
            <span class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-sm">
                {{ post.category }}
            </span>
        </div>

        <!-- Blog Content -->
        <div class="prose prose-lg max-w-none text-gray-700 leading-relaxed">
            {{ post.content|safe }}
        </div>

        <div class="mt-16 pt-10 border-t border-gray-200">
            <a href="/blog/" 
               class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-700 font-medium">
                ← Back to All Blogs
            </a>
        </div>
    </div>
</section>
{% endblock %}
