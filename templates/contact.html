{% extends 'base.html' %}

{% block title %}Contact Us - PixelPilot{% endblock %}

{% block content %}
<section class="py-20">
    <div class="max-w-7xl mx-auto px-6">
        <h1 class="text-5xl font-bold text-center mb-16">Get In Touch</h1>
        
        <div class="grid md:grid-cols-2 gap-16">
            <!-- Contact Form -->
            <div>
                <form action="#" method="POST" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">Your Name</label>
                        <input type="text" class="w-full px-6 py-4 border rounded-2xl focus:outline-none focus:border-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Business Email</label>
                        <input type="email" class="w-full px-6 py-4 border rounded-2xl focus:outline-none focus:border-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Message</label>
                        <textarea rows="6" class="w-full px-6 py-4 border rounded-2xl focus:outline-none focus:border-blue-500" placeholder="Tell us about your project..."></textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-semibold text-lg hover:bg-blue-700">
                        Send Message
                    </button>
                </form>
            </div>

            <!-- Contact Info -->
            <div class="space-y-10">
                <div>
                    <h3 class="text-2xl font-semibold mb-6">Contact Information</h3>
                    <div class="space-y-6">
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-envelope text-2xl text-blue-600"></i>
                            <div>
                                <p class="font-medium">Email</p>
                                <p>{{ company.email }}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-phone text-2xl text-blue-600"></i>
                            <div>
                                <p class="font-medium">Phone / WhatsApp</p>
                                <p>{{ company.phone }}</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <a href="https://wa.me/{{ company.whatsapp|slice:'1:' }}" target="_blank"
                   class="block bg-green-600 text-white text-center py-5 rounded-2xl font-semibold text-lg">
                    💬 Chat on WhatsApp
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
